<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DS5Control</title>
<!--
  El menú de clic derecho de la bandeja, igual que MenuBandeja.xaml de la versión en C#:
  caja de 190 px mínimo con 6 px de relleno, borde de 1 px y esquinas de 10 px; elementos de
  13 px Segoe UI con 12x8 de relleno y esquinas de 6 px; separador de 1 px con 8x4 de margen;
  flecha en los que tienen submenú, y los submenús desplegados al lado al pasar el ratón.
  La app le pasa los datos con window.pintar() y coloca la ventana con window.colocar().
-->
<style>
  :root {
    --fondo: #ffffff;
    --texto: #16233a;
    --resalte: #f2f4f7;
    --linea: #dde3ec;
  }
  :root.oscuro {
    --fondo: #191b1f;
    --texto: #f2f4f7;
    --resalte: #2c2f35;
    --linea: #2c2f35;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  .caja {
    position: absolute;
    left: 0;
    top: 0;
    min-width: 190px;
    box-sizing: border-box;
    padding: 6px;
    border: 1px solid var(--linea);
    border-radius: 10px;
    background: var(--fondo);
    color: var(--texto);
    font: 13px "Segoe UI", sans-serif;
  }
  .caja.sub { min-width: 170px; visibility: hidden; }
  .caja.sub.abierto { visibility: visible; }
  .elemento {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .elemento .nombre { flex: 1; }
  .elemento svg { margin-left: 16px; flex: none; }
  .elemento:hover, .elemento.desplegado { background: var(--resalte); }
  .elemento.negrita { font-weight: 700; }
  .elemento.apagado { opacity: 0.5; }
  .elemento.apagado:hover { background: transparent; }
  .linea { height: 1px; margin: 4px 8px; background: var(--linea); }
</style>
</head>
<body>
<div class="caja" id="menu"></div>
<script>
  (function () {
    const menu = document.getElementById('menu')
    let submenus = []
    let lado = 'derecha'

    const enviar = (m) => {
      const tauri = window.__TAURI__
      if (tauri) tauri.core.invoke('mensaje', { mensaje: Object.assign({ tipo: 'menuBandeja' }, m) })
    }
    const conNumero = (plantilla, n) => String(plantilla || '').replace('{}', n)

    // La flecha de MenuBandeja.xaml: "M0,0 L4,4 L0,8" con trazo de 1,5.
    const flecha = () => {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      s.setAttribute('width', '6'); s.setAttribute('height', '10'); s.setAttribute('viewBox', '-1 -1 6 10')
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      p.setAttribute('d', 'M0,0 L4,4 L0,8')
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '1.5')
      s.appendChild(p)
      return s
    }

    const elemento = (caja, texto, opciones = {}) => {
      const d = document.createElement('div')
      d.className = 'elemento'
      if (opciones.negrita) d.classList.add('negrita')
      if (opciones.apagado) d.classList.add('apagado')
      const n = document.createElement('span')
      n.className = 'nombre'
      n.textContent = texto
      d.appendChild(n)
      if (opciones.hijos) d.appendChild(flecha())
      if (opciones.alPulsar && !opciones.apagado) d.addEventListener('click', opciones.alPulsar)
      caja.appendChild(d)
      return d
    }
    const linea = (caja) => { const d = document.createElement('div'); d.className = 'linea'; caja.appendChild(d) }

    const cerrarSubmenu = () => {
      for (const s of submenus) {
        s.caja.classList.remove('abierto')
        s.padre.classList.remove('desplegado')
      }
    }
    window.cerrarSubmenu = cerrarSubmenu

    // Un elemento con submenú: al pasar el ratón se despliega al lado, a la altura del elemento.
    const conSubmenu = (texto, hijos, opciones = {}) => {
      const padre = elemento(menu, texto, { hijos: hijos.length > 0, apagado: opciones.apagado })
      if (!hijos.length || opciones.apagado) {
        padre.addEventListener('mouseenter', cerrarSubmenu)
        return
      }
      const caja = document.createElement('div')
      caja.className = 'caja sub'
      for (const h of hijos) elemento(caja, h.texto, { alPulsar: h.alPulsar })
      document.body.appendChild(caja)
      submenus.push({ caja, padre })
      padre.addEventListener('mouseenter', () => {
        cerrarSubmenu()
        const m = menu.getBoundingClientRect()
        const p = padre.getBoundingClientRect()
        const ancho = caja.offsetWidth
        const alto = caja.offsetHeight
        caja.style.left = (lado === 'derecha' ? m.right + 8 : m.left - 8 - ancho) + 'px'
        caja.style.top = Math.max(0, Math.min(p.top - 7, window.innerHeight - alto)) + 'px'
        caja.classList.add('abierto')
        padre.classList.add('desplegado')
      })
    }

    // `PopulateContextMenu`: perfiles de cada mando, Desconectar, separador, Abrir, Detener o
    // Iniciar, separador y Salir.
    window.pintar = (datos) => {
      const t = datos.textos || {}
      document.documentElement.classList.toggle('oscuro', !!datos.oscuro)
      for (const s of submenus) s.caja.remove()
      submenus = []
      menu.replaceChildren()
      const mandos = datos.mandos || []
      for (const m of mandos) {
        conSubmenu(conNumero(t.perfil, m.ranura + 1), (datos.perfiles || []).map((nombre) => ({
          texto: nombre,
          alPulsar: () => enviar({ accion: 'perfil', ranura: m.ranura, nombre }),
        })))
      }
      conSubmenu(t.desconectar, mandos.filter((m) => m.desconectable).map((m) => ({
        texto: conNumero(t.mando, m.ranura + 1),
        alPulsar: () => enviar({ accion: 'desconectar', ranura: m.ranura }),
      })), { apagado: mandos.length === 0 })
      linea(menu)
      const abrir = elemento(menu, t.abrir, { negrita: true, alPulsar: () => enviar({ accion: 'abrir' }) })
      abrir.addEventListener('mouseenter', cerrarSubmenu)
      const servicio = elemento(menu, datos.enMarcha ? t.detener : t.iniciar, { alPulsar: () => enviar({ accion: 'servicio' }) })
      servicio.addEventListener('mouseenter', cerrarSubmenu)
      linea(menu)
      const salir = elemento(menu, t.salir, { alPulsar: () => enviar({ accion: 'salir' }) })
      salir.addEventListener('mouseenter', cerrarSubmenu)

      // Lo que ocupan el menú y el submenú más grande, para que la app ajuste la ventana.
      requestAnimationFrame(() => {
        const anchoSub = Math.max(0, ...submenus.map((s) => s.caja.offsetWidth))
        const altoSub = Math.max(0, ...submenus.map((s) => s.caja.offsetHeight))
        enviar({ accion: 'tamano', anchoMenu: menu.offsetWidth, altoMenu: menu.offsetHeight, anchoSub, altoSub })
      })
    }

    window.colocar = (o) => {
      lado = o.lado
      menu.style.left = o.izquierda + 'px'
      menu.style.top = o.arriba + 'px'
    }

    // Un clic fuera de las cajas o Escape cierran el menú.
    document.addEventListener('mousedown', (e) => {
      if (!e.target.closest('.caja')) enviar({ accion: 'ocultar' })
    })
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') enviar({ accion: 'ocultar' }) })
    document.addEventListener('contextmenu', (e) => e.preventDefault())

    window.pintar(window.__MENU__ || { textos: {}, mandos: [], perfiles: [] })
  })()
</script>
</body>
</html>
