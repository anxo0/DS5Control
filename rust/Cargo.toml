[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
# Smaller and faster binary: the whole point of moving to Rust.
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The format tests go through thousands of profiles; without optimizing they take a minute.
[profile.dev.package.ds5-perfiles]
opt-level = 3
[profile.dev.package.roxmltree]
opt-level = 3
[profile.dev.package.ds5-informes]
opt-level = 3
[profile.dev.package.ds5-mapeo]
opt-level = 3
