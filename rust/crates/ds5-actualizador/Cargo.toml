[package]
name = "ds5-actualizador"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Cliente HTTP sin tokio; TLS con rustls. Sin gzip: HttpClient tampoco descomprimía.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# Solo lectura de zip con deflate, en Rust puro (miniz_oxide).
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
