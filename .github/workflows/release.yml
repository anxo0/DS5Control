name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de una release ya creada, por ejemplo v0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Version
      shell: bash
      run: |
        TAG=${{ inputs.tag }}
        echo "VERSION=${TAG#v}" >> $GITHUB_ENV
    - name: Interface
      working-directory: ui
      run: |
        npm ci
        npm run build
    - name: Tests
      run: dotnet test DS5ControlTests\DS5ControlTests.csproj -c Release -p:Platform=x64
    - name: Publish
      run: >
        dotnet publish DS5Control\DS5Control.csproj -c Release -p:Platform=x64 -r win-x64
        --self-contained true -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}
        -p:FileVersion=${{ env.VERSION }} -p:DebugType=none -o publicar
    # The program updates itself from the asset that ends in -win-x64.zip.
    - name: Portable
      run: |
        Copy-Item COPYING, README.md, ui\THIRD_PARTY.md publicar
        Compress-Archive publicar\* DS5Control-${{ env.VERSION }}-portable-win-x64.zip
    - name: Installer
      run: |
        choco install innosetup --no-progress -y
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=${{ env.VERSION }} "/DOrigen=$PWD\publicar" "/O$PWD" installer\ds5control.iss
    - name: Upload
      run: >
        gh release upload ${{ inputs.tag }} --clobber
        DS5Control-${{ env.VERSION }}-portable-win-x64.zip DS5Control-${{ env.VERSION }}-instalador.exe
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
