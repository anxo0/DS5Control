name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Version
      shell: bash
      run: |
        TAG=${{ github.event.release.tag_name }}
        echo "VERSION=${TAG#v}" >> $GITHUB_ENV
    - name: Interface
      working-directory: ui
      run: |
        npm ci
        npm run build
    - name: Tests
      run: dotnet test DS5ControlTests\DS5ControlTests.csproj -c Release -p:Platform=x64
    - name: Publish
      run: >
        dotnet publish DS5Control\DS5Control.csproj -c Release -p:Platform=x64 -r win-x64
        --self-contained false -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}
        -p:FileVersion=${{ env.VERSION }} -o publicar
    # The program updates itself from the asset that ends in -win-x64.zip.
    - name: Package
      run: |
        Copy-Item COPYING, README.md, ui\THIRD_PARTY.md publicar
        Compress-Archive publicar\* DS5Control-${{ env.VERSION }}-win-x64.zip
    - name: Upload
      run: gh release upload ${{ github.event.release.tag_name }} DS5Control-${{ env.VERSION }}-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
